services:
  postgres:
    image: postgres:16-alpine
    container_name: dotnet_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: taskflowdb
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    restart: always
    ports:
      - "6379:6379"